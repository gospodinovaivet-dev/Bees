<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeeWorkers - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <button type="button" class="exit" id="exit-button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Exit
    </button>
    <div class="brand">
      <img src="images/bees/bee-1.png" alt="">
      <span>BeeWorkers</span>
    </div>
  </header>

  <main class="split">
    <section class="left">
      <img class="flower flower-a" src="images/flower.svg" alt="">
      <img class="flower flower-b" src="images/flower.svg" alt="">
      <div class="logo-text" id="logo-text">
        <h1 id="title" aria-label="The Bee's Workplace">
          <span class="line">The Bee's</span>
          <span class="line">Workplace</span>
        </h1>
        <svg class="underline" viewBox="0 0 400 24" aria-hidden="true" preserveAspectRatio="none">
          <path d="M6 14C60 2 100 22 160 12S270 4 394 12" pathLength="1"/>
        </svg>
      </div>
    </section>

    <section class="right">
      <div class="auth" id="auth">
        <input type="radio" name="tab" id="tab-login" checked>
        <input type="radio" name="tab" id="tab-register">

        <div class="tabs">
          <label for="tab-login">Login</label>
          <label for="tab-register">Register</label>
        </div>

        <form id="login-form">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="email">

          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password">

          <button type="button" data-say="Welcome to the hive!">Login</button>
        </form>

        <form id="register-form">
          <label for="register-name">Name</label>
          <input type="text" id="register-name" autocomplete="name">

          <label for="register-email">Email</label>
          <input type="email" id="register-email" autocomplete="email">

          <label for="register-password">Password</label>
          <input type="password" id="register-password" autocomplete="new-password">

          <label for="register-confirm">Confirm Password</label>
          <input type="password" id="register-confirm" autocomplete="new-password">

          <button type="button" data-say="New worker bee!">Register</button>
        </form>
      </div>
    </section>
  </main>

  <!-- The flying bees are added here by script.js -->
  <div id="bee-layer" aria-hidden="true"></div>
</body>
</html>
