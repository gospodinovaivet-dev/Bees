<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeeWorkers - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="static/style.css">
  <script src="static/bees.js" defer></script>
  <script src="static/login.js" defer></script>
</head>
<body class="login-page">
  <!-- Page transition: lifts away when the page opens (see style.css) -->
  <div class="curtain" aria-hidden="true"><img src="images/bees/bee-1.png" alt=""><span>Login</span></div>

  <header class="site-header">
    <button type="button" class="exit" id="exit-button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Exit
    </button>
    <div class="brand">
      <img src="static/images/bees/bee-1.png" alt="">
      <span>BeeWorkers</span>
    </div>
  </header>

  <main class="split">
    <section class="left">
      <img class="flower flower-a" src="images/flowers/flower-12.png" alt="">
      <img class="flower flower-b" src="images/flowers/flower-4.png" alt="">
      <div class="logo-text" id="logo-text" data-bee-avoid>
        <h1 id="title" aria-label="The Bee's Workplace">
          <span class="line">The Bee's</span>
          <span class="line">Workplace</span>
        </h1>
        <svg class="underline" viewBox="0 0 400 24" aria-hidden="true" preserveAspectRatio="none">
          <path d="M6 14C60 2 100 22 160 12S270 4 394 12" pathLength="1"/>
        </svg>
      </div>
    </section>

    <section class="right">
      <img class="flower flower-c" src="images/flowers/flower-11.png" alt="">
      <div class="auth" id="auth" data-bee-avoid>
        <input type="radio" name="tab" id="tab-login" checked>
        <input type="radio" name="tab" id="tab-register">

        <div class="tabs">
          <label for="tab-login">Login</label>
          <label for="tab-register">Register</label>
        </div>

        <!-- login.js animates this box's height when switching tabs.
             Each password field also gets a flower button that shows the password. -->
        <div class="forms" id="forms">
          <form id="login-form" class="active" novalidate>
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="login-email" autocomplete="email">

            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="login-password" autocomplete="current-password">

            <p class="form-message" aria-live="polite"></p>
            <button type="submit">Login</button>
          </form>

          <form id="register-form" novalidate>
            <label for="register-name">Name</label>
            <input type="text" id="register-name" name="register-name" autocomplete="name">

            <label for="register-email">Email</label>
            <input type="email" id="register-email" name="register-email" autocomplete="email">

            <label for="register-password">Password</label>
            <input type="password" id="register-password" name="register-password" autocomplete="new-password">

            <label for="register-confirm">Confirm Password</label>
            <input type="password" id="register-confirm" name="register-confirm" autocomplete="new-password">

            <p class="form-message" aria-live="polite"></p>
            <button type="submit">Register</button>
          </form>
        </div>

        <!-- TEMPORARY: one-click mock account for testing. Remove before going live. -->
        <button type="button" class="demo" id="demo-login">
          Use demo account <span>temporary</span>
        </button>
      </div>
    </section>
  </main>

  <!-- The flying bees are added here by bees.js -->
  <div id="bee-layer" aria-hidden="true"></div>
</body>
</html>
